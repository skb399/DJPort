{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <h2>Edit Comment</h2>

            <form method="POST">
                {% csrf_token %}

                {{ comment_form|crispy }}

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a
                    href="{% url 'event_detail' comment.event.slug %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>

{% endblock %}
