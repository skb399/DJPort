{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row">
        <div class="col-md-8 offset-md-2 text-center">

            <h1>Delete DJ Profile</h1>
            <p>
                Are you sure you want to delete this profile: <strong>{{ dj_profile.dj_name }}</strong>?
            </p> 
            <!-- Form to confirm deletion of the DJ profile -->
            <form method="POST">

                <!-- CSRF token for security -->
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Delete Profile
                </button>

                <a
                    href="{% url 'dj_profile_detail' dj_profile.slug %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>
            </form>

        </div>
    </div>
</div>

{% endblock %}
