{% extends "base.html" %} {% block content %}

<div class="container delete-confirm-container">
  <div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
      <div class="card">
        <div class="card-body p-4 text-center">
          <h1 class="mb-3">Delete DJ Profile</h1>
          <p class="mb-4">
            Are you sure you want to delete this profile:
            <strong>{{ dj_profile.dj_name }}</strong>?
          </p>
          <!-- Form to confirm deletion of the DJ profile -->
          <form method="POST">
            <!-- CSRF token for security -->
            {% csrf_token %}
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <button type="submit" class="btn btn-danger">
                Delete Profile
              </button>

              <a
                href="{% url 'dj_profile_detail' dj_profile.slug %}"
                class="btn btn-outline-light"
              >
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
