{% extends "base.html" %} {% block content %}

<div class="container delete-confirm-container">
  <div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
      <div class="card">
        <div class="card-body p-4 text-center">
          <h1 class="mb-3">Delete Event</h1>

          <p class="mb-3">
            Are you sure you want to delete
            <strong>{{ event.title }}</strong>?
          </p>
          <p class="mb-4">This cannot be undone.</p>
          <form method="POST">
            <!-- CSRF token for security to prevent cross-site request forgery -->
            {% csrf_token %}
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <button type="submit" class="btn btn-danger">Delete Event</button>
              <!-- Link to cancel the deletion and return to the event detail page -->
              <!-- The URL is dynamically generated using the event's slug to ensure 
                    the user is redirected to the correct event detail page. -->
              <a
                href="{% url 'event_detail' event.slug %}"
                class="btn btn-outline-light"
              >
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
