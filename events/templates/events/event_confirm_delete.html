{% extends "base.html" %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1>Delete Event</h1>

            <p>
                Are you sure you want to delete this event: <br>
                <strong>{{ event.title }}</strong>?
            </p>

            <p>This cannot be undone.</p>

            <form method="POST">
                <!-- CSRF token for security to prevent cross-site request forgery -->
                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Delete Event
                </button>
                
                <!-- Link to cancel the deletion and return to the event detail page -->
                <!-- The URL is dynamically generated using the event's slug to ensure 
                 the user is redirected to the correct event detail page. -->
                <a
                    href="{% url 'event_detail' event.slug %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
