{% extends "base.html" %}
{% load static %}

{% block content %}

<section class="home-hero text-center">
    <div class="container">

        <img
            src="{% static 'images/dj_port_logo.webp' %}"
            alt="DJ Port logo"
            class="hero-logo"
        >

        <h1 class="display-4 fw-bold">
            Discover Events. Find DJs. Connect with the Scene.
        </h1>

        <p class="lead">
            DJ Port brings together DJs, event organisers and music fans
            in one place.
        </p>

        <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
            <a href="{% url 'event_list' %}" class="btn btn-primary btn-lg">
                Browse Events
            </a>

            <a href="{% url 'dj_profile_list' %}" class="btn btn-primary btn-lg">
                Discover DJs
            </a>
        </div>

    </div>
</section>

{% endblock %}
