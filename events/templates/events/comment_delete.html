{% extends "base.html" %} 
{% block content %}

<div class="container delete-confirm-container">
  <div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
      <div class="card">
        <div class="card-body p-4 text-center">
          <h1 class="mb-3">Delete Comment</h1>

          <p class="mb-3">Are you sure you want to delete this comment?</p>

          <!-- Blockquote used for emphasis -->
          <blockquote class="blockquote mb-4">
            <p>"{{ comment.body }}"</p>
          </blockquote>

          <form method="POST">
            <!-- CSRF token for security to prevent cross-site request forgery -->
            {% csrf_token %}
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <button type="submit" class="btn btn-danger">Delete Comment</button>

              <a
                href="{% url 'event_detail' comment.event.slug %}"
                class="btn btn-outline-light"
              >
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
